<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Reaction Chamber</title>
    <meta name="description" content="Virtual chemistry laboratory." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app" class="app">
      <main id="bench-container" class="bench" aria-label="Lab bench"></main>

      <div id="loading" class="loading" role="status" aria-live="polite">
        <div class="loading-card">
          <svg class="loading-flask" viewBox="0 0 48 48" width="44" height="44" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
            <path d="M19 5h10M20 5v13L9 38a2.4 2.4 0 002.1 3.6h25.8A2.4 2.4 0 0039 38L28 18V5"/>
            <path class="loading-liquid" d="M13.5 31h21l3.6 6.6a1.2 1.2 0 01-1 1.8H10.9a1.2 1.2 0 01-1-1.8z" fill="currentColor" stroke="none"/>
          </svg>
          <p class="loading-title">Loading</p>
          <p class="loading-detail" id="loading-detail"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
